<div class="top-container">
    <app-header></app-header>
<div class="main-content">
    <div class="content" *ngFor="let item of data">
        <div class="card" >
        <img [src]="item.image" class="card-img-top" alt="...">
        <div class="card-body">
            <h2 class="card-title">{{item.type}}</h2>
            <span href="#" class="price">Price: ₹ {{item.price}}</span>
            <p class="card-text">{{item.content}}</p>
        </div>
    </div>
    </div>
</div>
</div>

<div class="my-ads">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5688286738224844"
     crossorigin="anonymous"></script>
</div>
